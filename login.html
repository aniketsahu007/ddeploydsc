<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Sign in to SettleLens — Payment clarity, finally.">
  <meta name="theme-color" content="#11110f">
  <title>Sign In — SettleLens</title>
  <script src="assets/js/site-theme.js"></script>
  <link rel="icon" type="image/png" href="assets/images/settlelens-logo.png">
  <link rel="stylesheet" href="assets/css/landing.css">
  <style>
    .login-page {
      display: grid;
      place-items: center;
      min-height: 100svh;
      padding: calc(102px + 2rem) clamp(1rem, 4vw, 2rem) 2rem;
    }

    .login-card {
      width: 100%;
      max-width: 420px;
      min-width: 0;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 24px;
      padding: 2.75rem;
      animation: card-in 0.5s cubic-bezier(0.22, 1, 0.36, 1) both;
    }

    @keyframes card-in {
      from { opacity: 0; transform: translateY(20px) scale(0.98); }
      to   { opacity: 1; transform: translateY(0) scale(1); }
    }

    .login-heading {
      font-size: clamp(1.6rem, 4vw, 2.2rem);
      font-weight: 600;
      line-height: 1.1;
      margin-bottom: 0.4rem;
    }

    .login-sub {
      color: var(--muted);
      font-size: 0.97rem;
      margin-bottom: 2rem;
    }

    .field {
      margin-bottom: 1.2rem;
    }

    .field label {
      display: block;
      font-size: 0.75rem;
      font-weight: 500;
      letter-spacing: 0.09em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 0.45rem;
    }

    .field input {
      width: 100%;
      background: rgba(255,255,255,0.04);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 0.85rem 1rem;
      color: var(--fg);
      font-family: inherit;
      font-size: 1rem;
      transition: border-color 0.2s, background 0.2s;
      box-sizing: border-box;
    }

    .field input:focus {
      outline: none;
      border-color: var(--accent);
      background: rgba(255,255,255,0.06);
    }

    .field input::placeholder { color: var(--muted); opacity: 0.5; }

    .login-submit {
      width: 100%;
      margin-top: 0.25rem;
      padding: 0.95rem 1rem;
      background: var(--accent);
      color: var(--bg);
      border: none;
      border-radius: 8px;
      font-family: inherit;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.2s, opacity 0.2s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
    }

    .login-submit:hover:not(:disabled) { transform: translateY(-1px); opacity: 0.92; }
    .login-submit:active:not(:disabled) { transform: translateY(0); }
    .login-submit:disabled { opacity: 0.55; cursor: not-allowed; }

    .spinner {
      width: 16px; height: 16px;
      border: 2px solid rgba(17,17,15,0.25);
      border-top-color: var(--bg);
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      display: none;
    }
    .login-submit.loading .spinner { display: block; }
    .login-submit.loading .btn-label { display: none; }
    @keyframes spin { to { transform: rotate(360deg); } }

    .login-error {
      margin-top: 1rem;
      padding: 0.7rem 1rem;
      background: rgba(255,80,80,0.08);
      border: 1px solid rgba(255,80,80,0.2);
      border-radius: 8px;
      color: #ff7070;
      font-size: 0.88rem;
      display: none;
    }
    .login-error.visible { display: block; }

    .login-footer {
      text-align: center;
      margin-top: 1.5rem;
      font-size: 0.82rem;
      color: var(--muted);
    }
    .login-footer a { color: var(--muted); text-decoration: underline; text-underline-offset: 2px; }

    .login-divider {
      display: flex;
      align-items: center;
      margin: 1.5rem 0;
      color: var(--muted);
      font-size: 0.85rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    .login-divider::before, .login-divider::after {
      content: '';
      flex: 1;
      height: 1px;
      background: var(--line);
    }
    .login-divider span {
      padding: 0 1rem;
    }

    .google-submit {
      width: 100%;
      padding: 0.85rem 1rem;
      background: var(--panel);
      color: var(--fg);
      border: 1px solid var(--line);
      border-radius: 8px;
      font-family: inherit;
      font-size: 0.95rem;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.2s, transform 0.2s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.6rem;
    }
    .google-submit:hover {
      background: rgba(255,255,255,0.02);
      transform: translateY(-1px);
    }
    .google-icon {
      width: 18px;
      height: 18px;
    }

    @media (max-width: 800px) {
      .login-page { padding-top: calc(84px + 1.5rem); }
    }

    @media (max-width: 480px) {
      .login-page { align-items: start; padding-inline: 1rem; }
      .login-card { padding: 1.5rem; border-radius: 16px; }
    }
  </style>
</head>
<body>
  <div class="grain" aria-hidden="true"></div>

  <header class="nav-wrap">
    <a class="logo" href="index.html" aria-label="Back to SettleLens home">
      <img class="brand-logo-image" src="assets/images/settlelens-logo.png" alt="SettleLens">
    </a>
  </header>

  <main class="login-page" id="main">
    <div class="login-card">
      <h1 class="login-heading">Sign in</h1>
      <p class="login-sub">Access your settlement dashboard.</p>

      <form id="login-form" novalidate>
        <div class="field">
          <label for="email">Email</label>
          <input
            type="email"
            id="email"
            name="email"
            autocomplete="email"
            placeholder="you@example.com"
            required
          >
        </div>
        <div class="field">
          <label for="password">Password</label>
          <input
            type="password"
            id="password"
            name="password"
            autocomplete="current-password"
            placeholder="••••••••"
            required
          >
        </div>

        <button type="submit" class="login-submit" id="login-btn">
          <span class="btn-label">Sign in ↗</span>
          <span class="spinner" aria-hidden="true"></span>
        </button>

        <div class="login-error" id="login-error" role="alert"></div>
      </form>

      <div class="login-divider">
        <span>or</span>
      </div>

      <button type="button" class="google-submit" id="google-btn">
        <svg viewBox="0 0 24 24" class="google-icon" aria-hidden="true">
          <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
          <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.16v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
          <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.16C1.43 8.55 1 10.22 1 12s.43 3.45 1.16 4.93l3.68-2.84z" fill="#FBBC05"/>
          <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.16 7.07l3.68 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
        </svg>
        Continue with Google
      </button>

      <p class="login-footer"><a href="index.html">← Back to home</a></p>
    </div>
  </main>

  <!-- Local config (gitignored) -->
  <script src="config.js"></script>
  <script src="assets/js/supabase-loader.js"></script>
  <script src="assets/js/login.js"></script>
</body>
</html>
